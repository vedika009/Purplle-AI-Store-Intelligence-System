services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_PATH=store_intelligence.db
    volumes:
      - ./store_layout.json:/app/store_layout.json
      - ./pos_transactions.csv:/app/pos_transactions.csv
    command: uvicorn src.api.app:app --host 0.0.0.0 --port 8000
