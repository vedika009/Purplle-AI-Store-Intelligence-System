<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Purplle AI Store Intelligence</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .metric-card {
            @apply bg-white rounded-xl shadow-md p-6 flex flex-col justify-between transition-transform transform hover:scale-105;
        }
    </style>
</head>
<body class="bg-gray-50 font-sans text-gray-900 min-h-screen">
    <nav class="bg-purple-700 text-white shadow-lg p-4 sticky top-0 z-50">
        <div class="container mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
                <h1 class="text-2xl font-bold tracking-wide">Purplle AI Store Intelligence</h1>
            </div>
            <div class="text-sm font-medium bg-purple-800 py-1 px-3 rounded-full flex items-center space-x-2">
                <span class="w-2 h-2 rounded-full bg-green-400 animate-pulse"></span>
                <span id="store-id-display">store_1</span>
            </div>
        </div>
    </nav>

    <main class="container mx-auto p-6 space-y-6">
        <!-- Live Metrics Top Row -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
            <div class="metric-card">
                <h2 class="text-sm uppercase text-gray-500 font-semibold tracking-wider">Total Visitors</h2>
                <div class="mt-2 flex items-baseline">
                    <span id="val-total-visitors" class="text-4xl font-extrabold text-gray-900">0</span>
                </div>
            </div>
            <div class="metric-card border-l-4 border-purple-500">
                <h2 class="text-sm uppercase text-gray-500 font-semibold tracking-wider">Conversion Rate</h2>
                <div class="mt-2 flex items-baseline">
                    <span id="val-conversion-rate" class="text-4xl font-extrabold text-purple-600">0.0%</span>
                </div>
            </div>
            <div class="metric-card">
                <h2 class="text-sm uppercase text-gray-500 font-semibold tracking-wider">Avg Dwell Time</h2>
                <div class="mt-2 flex items-baseline">
                    <span id="val-avg-dwell" class="text-4xl font-extrabold text-gray-900">0s</span>
                </div>
            </div>
            <div class="metric-card">
                <h2 class="text-sm uppercase text-gray-500 font-semibold tracking-wider">Avg Queue Depth</h2>
                <div class="mt-2 flex items-baseline">
                    <span id="val-queue-depth" class="text-4xl font-extrabold text-gray-900">0</span>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <!-- Funnel Chart -->
            <div class="bg-white rounded-xl shadow-md p-6 lg:col-span-2">
                <h2 class="text-lg font-semibold text-gray-800 mb-4 border-b pb-2">Customer Journey Funnel</h2>
                <div class="h-64 relative w-full">
                    <canvas id="funnelChart"></canvas>
                </div>
            </div>

            <!-- Anomalies Feed -->
            <div class="bg-white rounded-xl shadow-md p-6 flex flex-col h-full">
                <div class="flex justify-between items-center mb-4 border-b pb-2">
                    <h2 class="text-lg font-semibold text-gray-800">Active Anomalies</h2>
                    <span id="anomaly-badge" class="bg-red-100 text-red-800 text-xs font-semibold px-2.5 py-0.5 rounded-full hidden">Alerts</span>
                </div>
                <div id="anomaly-list" class="flex-1 overflow-y-auto space-y-3 max-h-64 pr-2">
                    <div class="text-gray-400 text-sm italic text-center mt-10" id="no-anomalies">No active anomalies detected.</div>
                </div>
            </div>
        </div>
    </main>

    <script>
        const STORE_ID = 'purplle_brigade_road';
        document.getElementById('store-id-display').textContent = STORE_ID;

        // Initialize Chart.js
        const ctx = document.getElementById('funnelChart').getContext('2d');
        const funnelChart = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: ['Entered', 'Browsed', 'Checked Out'],
                datasets: [{
                    label: 'Visitor Count',
                    data: [0, 0, 0],
                    backgroundColor: [
                        'rgba(147, 51, 234, 0.8)',  // Purple 600
                        'rgba(168, 85, 247, 0.8)',  // Purple 500
                        'rgba(192, 132, 252, 0.8)'  // Purple 400
                    ],
                    borderColor: [
                        'rgb(126, 34, 206)',
                        'rgb(147, 51, 234)',
                        'rgb(168, 85, 247)'
                    ],
                    borderWidth: 1,
                    borderRadius: 4
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    y: {
                        beginAtZero: true,
                        grid: { borderDash: [2, 4], color: '#e5e7eb' }
                    },
                    x: {
                        grid: { display: false }
                    }
                },
                plugins: {
                    legend: { display: false }
                }
            }
        });

        async function fetchDashboardData() {
            try {
                // Fetch Metrics
                const metricsRes = await fetch(`/stores/${STORE_ID}/metrics`);
                if (metricsRes.ok) {
                    const metrics = await metricsRes.json();
                    document.getElementById('val-total-visitors').textContent = metrics.total_visitors || 0;
                    document.getElementById('val-conversion-rate').textContent = (metrics.conversion_rate || 0).toFixed(1) + '%';
                    document.getElementById('val-avg-dwell').textContent = Math.round(metrics.avg_dwell_time_minutes * 60) + 's';
                    document.getElementById('val-queue-depth').textContent = (metrics.avg_queue_depth || 0).toFixed(1);
                }

                // Fetch Funnel
                const funnelRes = await fetch(`/stores/${STORE_ID}/funnel`);
                if (funnelRes.ok) {
                    const funnel = await funnelRes.json();
                    funnelChart.data.datasets[0].data = [
                        funnel.entered || 0,
                        funnel.browsed || 0,
                        funnel.checked_out || 0
                    ];
                    funnelChart.update();
                }

                // Fetch Anomalies
                const anomaliesRes = await fetch(`/stores/${STORE_ID}/anomalies`);
                if (anomaliesRes.ok) {
                    const data = await anomaliesRes.json();
                    updateAnomaliesList(data.active_anomalies || []);
                }

            } catch (error) {
                console.error("Error fetching dashboard data:", error);
            }
        }

        function updateAnomaliesList(anomalies) {
            const listEl = document.getElementById('anomaly-list');
            const noAnomaliesEl = document.getElementById('no-anomalies');
            const badgeEl = document.getElementById('anomaly-badge');

            if (anomalies.length === 0) {
                listEl.innerHTML = '';
                listEl.appendChild(noAnomaliesEl);
                noAnomaliesEl.style.display = 'block';
                badgeEl.classList.add('hidden');
                return;
            }

            noAnomaliesEl.style.display = 'none';
            badgeEl.classList.remove('hidden');
            badgeEl.textContent = `${anomalies.length} Alerts`;
            
            // Rebuild list
            listEl.innerHTML = '';
            anomalies.forEach(anomaly => {
                const item = document.createElement('div');
                item.className = 'p-3 rounded-lg border-l-4 bg-gray-50 ' + getAnomalyColorClass(anomaly.anomaly_type);
                
                const time = new Date(anomaly.timestamp).toLocaleTimeString();
                
                item.innerHTML = `
                    <div class="flex justify-between items-start">
                        <span class="font-bold text-sm text-gray-800">${anomaly.anomaly_type.replace('_', ' ')}</span>
                        <span class="text-xs text-gray-500">${time}</span>
                    </div>
                    <p class="text-xs text-gray-600 mt-1">${anomaly.description}</p>
                `;
                listEl.appendChild(item);
            });
        }

        function getAnomalyColorClass(type) {
            if (type.includes('QUEUE')) return 'border-orange-500';
            if (type.includes('DROP')) return 'border-red-500';
            if (type.includes('DEAD')) return 'border-yellow-500';
            return 'border-gray-500';
        }

        // Poll every 2 seconds
        setInterval(fetchDashboardData, 2000);
        
        // Initial fetch
        fetchDashboardData();
    </script>
</body>
</html>
